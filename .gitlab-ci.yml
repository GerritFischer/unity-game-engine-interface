# pylint config:
# C0114: Disabled file docstring
# C0115: Disabled class docstring
# W0511: Disabled fixme warning
# W0231: Disabled super class init
# E0401: Disabled import errors
# W0621: Disabled redefining error, error from simulator class
# R1732: Disabled with for resource-allocation

stages:
  - code_quality
  - type_checking

pylint:
  image: "python:3.11"
  stage: code_quality
  script:
      - pip install pylint
      - pylint --max-line-length=160 --generated-members cv2 --disable W0511,C0114,C0115,W0231,W0621,E0401,R1732 demo/unity.py

mypy:
  image: "python:3.11"
  stage: type_checking
  script:
      - pip install mypy
      - mypy --ignore-missing-imports demo/unity.py
  